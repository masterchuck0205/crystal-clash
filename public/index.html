<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crystal Clash</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#14122b;--panel:#221d45;--amethyst:#7b5cf0;--aqua:#35e0d0;--gold:#ffc94a;--rose:#ff5d7a;--text:#f2efff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:"Lilita One",system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
#app,#game{height:100%}
#menu{height:100%;overflow-y:auto;padding:28px 18px 40px;text-align:center;background:radial-gradient(ellipse at 50% 0,#3b2d86 0,transparent 60%),radial-gradient(ellipse at 90% 100%,#0e5560 0,transparent 55%),var(--ink)}
h1{font-size:clamp(48px,13vw,84px);line-height:.95;margin:10px 0 8px;font-weight:400;color:var(--gold);text-shadow:0 4px 0 #b4561f,0 8px 0 var(--amethyst),0 14px 24px rgba(0,0,0,.5);letter-spacing:1px}
.tag{margin:0 auto 22px;max-width:30ch;font-family:system-ui,sans-serif;font-weight:600;opacity:.8}
.seg{display:inline-flex;background:var(--panel);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{background:none;padding:9px 18px;border-radius:10px;font-size:18px;opacity:.7}
.seg button.on{background:var(--amethyst);opacity:1}
.big{display:block;margin:0 auto 34px;padding:16px 56px;font-size:30px;border-radius:18px;background:linear-gradient(#ffd96b,#f0a21f);color:#4a2400;box-shadow:0 6px 0 #a35d0a,0 12px 22px rgba(0,0,0,.4);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a35d0a}
h2{font-weight:400;font-size:24px;margin:0 0 12px}
#codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-width:760px;margin:0 auto;text-align:left}
.cx{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--panel);border-radius:14px;padding:10px;border:2px solid #34296a}
.cx .em{font-size:30px;display:grid;place-items:center;border-radius:12px;background:#120f2a;position:relative}
.cx .em i{position:absolute;left:-6px;top:-6px;background:var(--amethyst);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px;font-style:normal}
.cx b{font-weight:400;font-size:17px}.cx p{margin:2px 0 0;font:600 12px/1.35 system-ui,sans-serif;opacity:.75}
#game{display:flex;flex-direction:column;background:#0d0b20}
#hud{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:20px;gap:8px}
#hud button{background:var(--panel);border-radius:10px;padding:5px 12px;font-size:16px}
#time{font-size:26px;text-align:center;line-height:1}#time small{display:block;font-size:12px;color:var(--aqua);height:12px}
#cr{min-width:84px;text-align:right}
#stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
canvas{border-radius:10px;touch-action:none;box-shadow:0 0 0 3px #34296a}
#nx{width:44px;display:grid;place-items:center;background:var(--panel);border-radius:10px;font-size:22px;opacity:.7;position:relative}
#nx small{position:absolute;bottom:2px;font:600 9px system-ui,sans-serif}
#hand{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card{position:relative;background:linear-gradient(#3a2f7d,#2a2260);border-radius:12px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;border:3px solid #5440b8;transition:transform .12s}
.card .em{font-size:30px;line-height:1.1}.card b{font-weight:400;font-size:12px;white-space:nowrap}
.card i{position:absolute;left:-5px;top:-7px;background:var(--amethyst);border:2px solid #d9ccff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:14px;font-style:normal}
.card.sel{transform:translateY(-10px);border-color:var(--gold);box-shadow:0 0 16px var(--gold)}
.card.poor{filter:grayscale(.7) brightness(.7)}
#end{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,8,28,.82);text-align:center;z-index:5}
#end h1{margin-bottom:4px}#end p{font-size:24px;margin:0 0 22px}
#end .big{display:inline-block;margin:6px;padding:12px 30px;font-size:22px}
h3{grid-column:1/-1;font-weight:400;font-size:20px;margin:8px 0 0}
.cx{border:2px solid #34296a;text-align:left;width:100%}.cx.in{border-color:var(--rc);background:#2f2766;box-shadow:0 0 12px -2px var(--rc)}
.card{border-color:var(--rc,#5440b8)}.card b{font-size:10px;white-space:normal;line-height:1;text-align:center;min-height:20px}
.card.sel{border-color:var(--gold)}
.big:disabled{opacity:.5;filter:grayscale(.6);cursor:not-allowed}
#info{position:sticky;top:6px;z-index:3;display:grid;grid-template-columns:56px 1fr;gap:10px;max-width:760px;margin:0 auto 16px;padding:10px;background:#1a1640;border:2px solid var(--amethyst);border-radius:14px;text-align:left;box-shadow:0 8px 20px #000a}
#info .em{font-size:40px;display:grid;place-items:center}#info b{font-weight:400;font-size:20px}#info small{font:600 12px system-ui,sans-serif}
#info p{margin:3px 0;font:600 12px/1.35 system-ui,sans-serif;opacity:.85}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin:4px 0}.st{display:grid;grid-template-columns:46px 1fr 28px;gap:5px;align-items:center;font:600 11px system-ui,sans-serif}
.st b{font:700 11px system-ui,sans-serif;text-align:right}.bar{height:7px;background:#0b0920;border-radius:4px}.bar i{display:block;height:100%;border-radius:4px}
.row3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-width:760px;margin:0 auto 18px}
.pill{background:var(--panel);padding:9px 16px;border-radius:12px;font-size:17px;margin:0 0 18px 8px}
#sp{display:flex;gap:6px;max-width:520px;margin:0 auto 6px}
#sp button{flex:1;min-height:40px;border-radius:10px;font-size:13px;line-height:1.1;background:#2a2260;border:2px solid #5440b8;display:flex;flex-direction:column;justify-content:center;align-items:center}
#sp small{font:600 10px system-ui,sans-serif;opacity:.85}
#hero{border-color:#ff9a4a!important}#hero.sel{box-shadow:0 0 14px #ff9a4a}#hero.poor{filter:grayscale(.7) brightness(.7)}
#ult{background:linear-gradient(90deg,var(--amethyst) var(--p,0%),#2a2260 var(--p,0%))!important}#ult.rdy{border-color:var(--gold)!important;box-shadow:0 0 16px var(--gold)}

.ic{width:100%;height:100%;object-fit:contain;display:block}
.card .em{display:block;width:46px;height:46px}#nx .ic{width:32px;height:32px}#nx span{width:32px;height:32px}
#sp .ic{width:26px;height:26px;display:inline-block;vertical-align:middle}#sp span{display:flex;align-items:center;gap:4px}
.cx .em,#info .em{overflow:visible}.cx .em .ic{padding:3px}
/* arena layout: big field on the left, cards on the right, elixir along the top */
#hud{gap:12px;padding:8px 12px}
#elix{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#eb{display:flex;align-items:center;justify-content:center;gap:4px;min-width:62px;padding:2px 10px;border-radius:12px;background:var(--panel);border:2px solid #5440b8;font-size:24px;line-height:1.2}
#eb span{font-size:18px}
#eseg{flex:1;min-width:0;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
#eseg span{position:relative;height:28px;border-radius:8px;background:#120f2a;border:2px solid #34296a;overflow:hidden}
#eseg i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#e58bff,#a23bff)}
#eseg u{position:absolute;inset:0;display:grid;place-items:center;text-decoration:none;font:700 11px system-ui,sans-serif;color:#fff;opacity:.45}
#eseg.full i{background:linear-gradient(#ffe27a,#ffb02e);box-shadow:0 0 10px #ffc94a}
#main{flex:1;min-height:0;display:flex;justify-content:center;gap:10px;margin:0 12px 12px}
#stage{flex:0 0 auto;align-self:stretch}
#bot{width:clamp(180px,24vw,300px);display:flex;flex-direction:column;gap:8px;padding:0}
#nx{width:auto;flex:none;display:flex;flex-direction:row;align-items:center;gap:10px;padding:6px 12px;opacity:.85}
#nx small{position:static;font:700 13px system-ui,sans-serif}
#hand{flex:1;min-height:0;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(0,1fr);gap:10px}
.card{justify-content:center;gap:4px;padding:10px 4px 8px;min-height:0}
.card .em{width:clamp(52px,12vh,112px);height:clamp(52px,12vh,112px)}
.card b{font-size:clamp(13px,2.2vh,18px);min-height:0}
.card i{width:30px;height:30px;font-size:17px;left:-7px;top:-9px}
.card.sel{transform:translateX(-8px)}
#sp{flex:none;flex-direction:column;max-width:none;margin:0}
#sp button{min-height:54px;font-size:16px}
@media(max-aspect-ratio:1/1){
#hud{flex-wrap:wrap}#elix{order:5;flex-basis:100%}
#main{flex-direction:column;justify-content:flex-start}#stage{flex:1;min-height:0;align-self:center;display:flex;align-items:center}
#bot{width:auto}#nx{display:none}
#hand{flex:none;grid-template-columns:repeat(4,1fr);grid-auto-rows:auto}
.card .em{width:46px;height:46px}.card b{font-size:10px}.card.sel{transform:translateY(-8px)}
#sp{flex-direction:row}#sp button{min-height:44px;font-size:13px}}
#draft{height:100%;overflow-y:auto;padding:28px 18px 40px;text-align:center;background:radial-gradient(ellipse at 50% 0,#3b2d86 0,transparent 60%),radial-gradient(ellipse at 90% 100%,#0e5560 0,transparent 55%),var(--ink)}
#dpicks{min-height:54px;margin:0 auto 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.dp{width:46px;height:46px;background:#120f2a;border:2px solid #34296a;border-radius:10px;padding:3px}
#dopts .cx{padding:14px}
#mlab{font:700 13px system-ui,sans-serif;opacity:.9;white-space:nowrap}#mlab:empty{display:none}
#end>div{max-height:100%;overflow-y:auto;padding:16px}
#bk{max-width:440px;margin:0 auto 16px;text-align:left;font:600 14px/1.5 system-ui,sans-serif}
#bk h3{font-size:16px;margin:8px 0 2px;color:var(--gold)}#bk b{color:var(--aqua)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.pgh{display:flex;justify-content:center;align-items:center;gap:10px;font-size:22px;margin:0 0 10px;flex-wrap:wrap}.pgh span{background:var(--panel);padding:4px 12px;border-radius:12px}
#pgt{flex-wrap:wrap;justify-content:center}#pgt button{padding:7px 12px;font-size:16px}.cx:disabled{opacity:.45;cursor:not-allowed}
#emo{display:flex;gap:6px;flex:none}#emo button{flex:1;font-size:22px;line-height:1;padding:5px 0;background:#2a2260;border:2px solid #5440b8;border-radius:10px}
#cf{position:absolute;inset:0;overflow:hidden;pointer-events:none}#cf span{position:absolute;top:-8%;animation:cf 3s linear forwards}@keyframes cf{to{transform:translateY(115vh) rotate(540deg)}}
.tst{position:fixed;left:50%;transform:translateX(-50%);z-index:9;background:#1a1640;border:2px solid var(--gold);border-radius:12px;padding:8px 16px;font-size:18px;box-shadow:0 8px 20px #000a}
.rw{font:700 15px system-ui,sans-serif;color:var(--gold);margin:0 0 12px}
#onl{margin:0 0 16px}#onl .seg{align-items:center}#onl input{width:84px;text-align:center;font:inherit;font-size:20px;text-transform:uppercase;background:#120f2a;color:var(--text);border:2px solid #34296a;border-radius:10px;padding:6px}#game.onl #sp{display:none}
section,#end>div{animation:fadeIn .35s ease both}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
.cx{transition:transform .12s,box-shadow .15s,border-color .15s}.cx:hover:not(:disabled){transform:translateY(-2px)}.cx:active:not(:disabled){transform:scale(.98)}
.big:hover{filter:brightness(1.08)}.seg button{transition:background .15s,opacity .15s}.pill{transition:transform .1s}.pill:active{transform:scale(.96)}
#pk{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;overflow-y:auto;background:radial-gradient(ellipse at 50% 30%,#3b2d86,#0d0b20 75%);animation:fadeIn .3s}
#pkc{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:760px}
.pc{width:118px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:14px;background:linear-gradient(#3a2f7d,#221d45);border:3px solid var(--rc);box-shadow:0 0 18px -4px var(--rc);animation:pcIn .5s cubic-bezier(.2,1.3,.4,1) both;text-align:center}
.pc .em{width:64px;height:64px}.pc b{font-weight:400;font-size:15px}.pc small{font:700 11px system-ui,sans-serif;color:var(--rc)}.pc u{text-decoration:none;font-size:20px;color:var(--gold)}
.pc.leg{animation:pcIn .5s cubic-bezier(.2,1.3,.4,1) both,glow 1.2s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:0 0 34px 4px var(--rc)}}
@keyframes pcIn{from{opacity:0;transform:rotateY(90deg) scale(.5)}to{opacity:1;transform:none}}

#menu{display:flex;flex-direction:column;overflow:hidden;padding:0}
#top{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#0f0d24cc;border-bottom:2px solid #34296a;font-size:18px}
#top span{background:var(--panel);padding:3px 12px;border-radius:12px;white-space:nowrap}#top small{opacity:.6;font-size:12px;margin-left:2px}
#mbody{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 28px}.pn{max-width:760px;margin:0 auto}
#mnav{display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#0f0d24;border-top:2px solid #34296a}
#mnav button{flex:1;max-width:180px;position:relative;background:none;border-radius:12px;padding:6px 4px;font-size:15px;opacity:.65;display:flex;flex-direction:column;align-items:center}
#mnav button span{font-size:24px;line-height:1.1}#mnav button.on{opacity:1;background:var(--amethyst)}
.dot{position:absolute;top:2px;right:26%;width:11px;height:11px;border-radius:50%;background:var(--rose);border:2px solid #0f0d24}
#menu h1{font-size:clamp(40px,10vw,64px);margin:0 0 4px}#menu .tag{margin:0 auto 14px;font-size:14px;max-width:46ch}#menu h2{font-size:20px;margin:16px 0 8px}
#modes,#heroes,#ults{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:0 auto 6px;max-width:none}
#heroes,#ults{grid-template-columns:repeat(3,1fr)}
#modes .cx,#heroes .cx,#ults .cx,#codex .cx{grid-template-columns:1fr;justify-items:center;text-align:center;padding:8px 4px}
#modes .cx p,#heroes .cx p,#ults .cx p,#codex .cx p{display:none}
#modes .cx b,#heroes .cx b,#ults .cx b,#codex .cx b{font-size:14px;line-height:1.1}
#modes .cx .em,#heroes .cx .em,#ults .cx .em,#codex .cx .em{width:48px;height:48px}
#codex{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-width:none}
#opts{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}#opts .seg,#opts .pill{margin:0}
#dprev{margin:10px 0 14px}#dprev .pill{margin:0 0 0 6px}
.slots,#slots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-width:520px;margin:0 auto 8px}
.sl{aspect-ratio:1;background:#120f2a;border:2px dashed #34296a;border-radius:10px;padding:3px;display:block}.sl.f{border:2px solid var(--amethyst)}
.sa{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:8px;font:700 14px system-ui,sans-serif;margin-top:4px}.sa .pill{margin:0}
#info{top:0}.olrow{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.big.sm{display:inline-block;margin:0;padding:10px 26px;font-size:22px}#play{margin-bottom:10px}
.pn{animation:fadeIn .25s both}#snd{background:var(--panel);border-radius:12px;padding:3px 10px;font-size:18px}
#cfil{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:0 auto 12px}#cfil button{padding:6px 12px;font-size:15px}
#dtip{margin:6px auto 0;color:var(--gold);font-weight:700}
#play{position:relative;overflow:hidden}
#play:not(:disabled)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:sheen 3s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
@keyframes rdy{from{box-shadow:0 0 0 0 transparent}to{box-shadow:0 0 12px -2px var(--rc,#7b5cf0)}}
@keyframes bob{to{transform:translateY(-4px)}}
.card:not(.poor):not(.sel){animation:rdy 1.4s ease-in-out infinite alternate}.card:active{transform:scale(.94)}
#codex .cx{background:linear-gradient(#2d2662,#221d45)}#codex .cx[style*="#ffc94a"]:not(.in){animation:rdy 2s ease-in-out infinite alternate}
#menu h1{animation:bob 3.5s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){#play::after,#menu h1,.card,#codex .cx{animation:none!important}}
</style></head><body>
<main id="app">
<section id="menu">
<header id="top"></header>
<div id="mbody">
<div class="pn" id="pn-play">
<h1>Crystal<br>Clash</h1><p class="tag">Drop troops, tax the enemy bank, shatter the crystal king.</p>
<h2>Choose a mode</h2><div id="modes"></div><p class="tag" id="mdesc"></p>
<div id="opts"><div class="seg" id="diff" role="group" aria-label="Difficulty"></div><button class="pill" id="bossT"></button></div>
<div id="onl" hidden><p class="rw" id="ost"></p><div class="olrow"><button class="big sm" id="ocr">Create room</button><span>or</span><input id="ocd" maxlength="4" placeholder="CODE" aria-label="Room code" autocomplete="off"><button class="pill" id="ojn">Join</button></div><button class="pill" id="ocp" hidden>Copy invite link</button></div>
<div id="dprev"></div>
<button class="big" id="play">Battle</button>
</div>
<div class="pn" id="pn-deck" hidden>
<div id="info"></div>
<h2>Your deck <span id="dk"></span></h2><div id="slots"></div><p class="tag" id="dkh"></p>
<h2>Hero</h2><div class="row3" id="heroes"></div><h2>Ultimate</h2><div class="row3" id="ults"></div>
<h2>All cards</h2><div id="codex"></div>
</div>
<div class="pn" id="pn-pg" hidden><div id="pg"></div></div>
</div>
<nav id="mnav"></nav>
</section>
<section id="draft" hidden><h2 id="dh"></h2><div id="dpicks"></div><div class="row3" id="dopts"></div><button class="pill" id="dquit">Back to menu</button></section>
<section id="game" hidden>
<div id="hud"><button id="quit">Menu</button><div id="mlab"></div><div id="elix"><div id="eb"><span aria-hidden="true">💧</span><b id="etx">5</b></div><div id="eseg" role="img" aria-label="Elixir"></div></div><div id="time">3:00<small></small></div><div id="cr">👑 0 – 0</div></div>
<div id="main"><div id="stage"><canvas id="c" width="720" height="1280" aria-label="Battle arena"></canvas></div>
<div id="bot"><div id="nx"><span id="next"></span><small>Next</small></div><div id="hand"></div><div id="sp"><button id="hero"></button><button id="ult"></button></div><div id="emo"></div></div></div>
</section>
</main>
<div id="end" hidden><div><h1 id="rt">Victory</h1><p id="rs"></p><div id="bk"></div><button class="big" id="again">Rematch</button><button class="big" id="home">Menu</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=s=>document.querySelector(s),W=360,H=640,RV=320,BR=[80,280];
const cv=$('#c'),cx=cv.getContext('2d');cx.scale(2,2);
const C=(n,e,c,hp,d,s,r,cd,rar,col,t,x={})=>({n,e,c,hp,d,s,r,cd,rar,col,t,...x});
const CARDS={
sword:C('Swordsman','⚔️',3,900,120,38,18,1,0,'#7d86a8','Basic melee fighter.'),
archer:C('Archer','🏹',3,450,100,42,110,1.2,0,'#4aa3d8','Ranged attacker.'),
gob2:C('Goblin Duo','👺',2,300,75,85,14,.8,0,'#4f9a3a','Two fast goblins.',{num:2}),
shield:C('Shield Guard','🛡️',4,1200,90,30,18,1.3,0,'#5b7fb0','Takes half damage from the front.',{sh:1}),
spear:C('Spearman','🔱',2,400,110,46,80,1.4,0,'#b9a36a','Long-range spear thrower.',{bc:'#e8d9a0'}),

else v+=(c.bld?1:0)+(c.hp>=1500?.6:0)+(c.s>=60?.3:0)-(c.bg?1.5:0)+(hasTank&&c.r>=70?.8:0);return v};

aiPlay=function(dt){G.ai-=dt;if(G.ai>0)return;const df=G.df,[a,b]=[[4,6.5],[2.3,3.8],[1.4,2.5]][df];G.ad=G.ad||mkAiDeck();G.am=G.am||{last:[]};

G.E[1]-=CARDS[p.id].c;G.am.last=[p.id,...G.am.last].slice(0,3);spawn(p.id,1,p.x,p.y);G.ai=a+Math.random()*(b-a);if(df===2&&G.E[1]>=8)G.ai=.5};
